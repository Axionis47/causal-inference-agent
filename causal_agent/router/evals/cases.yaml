# One question per lane, pinned to its dataset. Expected values grade the router, not the estimate.
- id: students_adjustment
  dataset: students
  question: Did completing the prep course raise math scores?
  expected:
    family: adjustment
    outcome: math score
    treatment: test preparation course
    admissible_also: []
    must_reject: [diff_in_diff, discontinuity, synthetic_control, interrupted_series]

- id: marketing_randomised
  dataset: marketing
  question: Which of the three promotions produced the highest weekly sales?
  expected:
    family: adjustment
    outcome: SalesInThousands
    treatment: Promotion
    admissible_also: []
    must_reject: [diff_in_diff]

- id: card_krueger_did
  dataset: card_krueger
  question: Did New Jersey's 1992 minimum wage rise reduce fast food employment?
  expected:
    family: diff_in_diff
    outcome: total_emp_nov
    treatment: state
    admissible_also: []
    must_reject: [discontinuity, synthetic_control, interrupted_series, instrument]

- id: gov_transfers_rdd
  dataset: gov_transfers
  question: Did receiving the transfer raise support for the government?
  expected:
    family: discontinuity
    outcome: Support
    treatment: Participation
    admissible_also: []
    must_reject: [diff_in_diff, synthetic_control, interrupted_series, instrument]

- id: cigar_synth
  dataset: cigar
  question: What did California's 1989 tobacco tax do to cigarette sales?
  expected:
    family: synthetic_control
    outcome: sales
    treatment: state
    admissible_also: [diff_in_diff, interrupted_series]
    must_reject: [adjustment, discontinuity]

- id: senate_incumbency_rdd
  dataset: senate
  question: Does winning a Senate seat narrowly raise the Democratic vote share at the next election?
  expected:
    family: discontinuity
    outcome: vote
    treatment: margin
    admissible_also: []
    must_reject: [diff_in_diff, synthetic_control, interrupted_series, instrument, adjustment]

- id: headstart_rdd
  dataset: headstart
  question: Did Head Start funding reduce child mortality in the poorest counties?
  expected:
    family: discontinuity
    outcome: mort_age59_related_postHS
    treatment: povrate60
    admissible_also: []                # diff_in_diff is admitted on some runs and rejected on others (a pre-programme outcome exists); left ungraded
    must_reject: [synthetic_control, interrupted_series, instrument, adjustment]

- id: spp_fuzzy_rdd
  dataset: spp
  question: Did eligibility for the SPP scholarship raise immediate enrolment in higher education?
  expected:
