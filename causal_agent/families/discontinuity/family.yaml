# The discontinuity family: what it answers, what it needs, what it assumes. Written as method knowledge the routing reads
# and judges the data against, never as rules the harness evaluates. `needs_claims` is read by code for the fit grid.

applies_to: [effect_of_change]
answers: effect of a change that was assigned by a strict cutoff on one measured score, comparing rows just above and just below the cutoff
needs:
  - the note says the change was given to rows on one side of a cutoff value on a specific numeric score, and not on the other; a group label such as a state, region, or store is not a score and does not meet this
  - that score was fixed before the decision and could not be adjusted to get across the cutoff
  - rows exist close to the cutoff on both sides, meaning the score takes values just below and just above it
  - the outcome is measured after the decision
look_for: a change card or column note naming a cutoff and the column it applies to; the score column's note on when it was fixed; the score column's profile range around the cutoff
assumes: rows just either side of the cutoff are alike in everything except the change
weak_when: rows bunch up on one side of the cutoff; or other things also switch at the same cutoff
prefer_over:
  adjustment: when the change is a strict function of the score, no two rows with the same score differ in the change, so adjustment has nothing to compare; the cutoff is the only comparison; and when eligibility is decided by the cutoff but take-up is voluntary, the cutoff still identifies the effect for those who took it up because they crossed it, without assuming the take-up decision was fully measured
convince: rows sit close to the line on both sides and do not bunch at it, so the two sides can be compared
specialist: rdrobust
status: built

needs_claims:
    requires: [grain, sampling, change, assignment, measured, missing, cutoff_only]
    fits:
      assignment.kind: [cutoff_rule]
      cutoff_only.believed: [true]
