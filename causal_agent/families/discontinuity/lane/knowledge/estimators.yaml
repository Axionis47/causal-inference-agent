local_linear:
  in_words: local linear fit on each side of the cutoff within the MSE-optimal bandwidth,
    triangular weights; the jump at the cutoff is the effect for units at the cutoff
  params:
    p: 1
    kernel: tri
    masspoints: adjust
    level: 95
  fuzzy: false
  applies_when:
    kind:
    - sharp
  estimand: effect_at_cutoff
  assumes: units just either side of the cutoff are alike in everything except the
    change; the score's density and every predetermined characteristic are continuous
    at the cutoff
  weak_when: few rows near the cutoff, so the bandwidth is wide or the interval is
    long; or the score takes few distinct values
  prefer_over:
    local_quadratic: the Foundations recommend p=1 as the default; p=2 is a robustness
      check, not a first choice
  rank: 1
local_quadratic:
  in_words: the same local fit with a quadratic on each side; a robustness check on
    the polynomial order
  params:
    p: 2
    kernel: tri
    masspoints: adjust
    level: 95
  fuzzy: false
  applies_when:
    kind:
    - sharp
  estimand: effect_at_cutoff
  assumes: as local_linear
  weak_when: the quadratic fits noise near the boundary; the Foundations warn against
    higher orders as a default
  prefer_over: {}
  rank: 2
local_linear_fuzzy:
  in_words: the jump in the outcome divided by the jump in take-up at the cutoff,
    both local linear; the effect for units at the cutoff who took up the change because
    they crossed it
  params:
    p: 1
    kernel: tri
    masspoints: adjust
    level: 95
  fuzzy: true
  applies_when:
    kind:
    - fuzzy
    first_stage:
    - strong
  estimand: complier_effect_at_cutoff
  assumes: as local_linear, plus that crossing the cutoff only affects the outcome
    through take-up and moves take-up in one direction
  weak_when: the first stage is small, so the ratio is noisy
  prefer_over:
    local_linear_itt: when the first stage is strong the ratio answers the question
      about the change received, not merely about eligibility
  rank: 1
local_linear_itt:
  in_words: the jump in the outcome at the cutoff regardless of take-up; the effect
    of crossing the cutoff, which is what eligibility alone did
  params:
    p: 1
    kernel: tri
    masspoints: adjust
    level: 95
  fuzzy: false
  applies_when:
    kind:
    - fuzzy
    first_stage:
    - strong
    - weak
  estimand: itt_at_cutoff
  assumes: as local_linear
  weak_when: take-up barely moves at the cutoff, so the jump says little about the
    change itself; the Extensions say to report only this quantity then
  prefer_over: {}
  rank: 2
local_randomisation:
  in_words: treat the units in a small window either side of the line as if assigned
    at random; the difference in their mean outcomes is the effect, the p-value is
    how unusual that difference is when the sides are reshuffled, and the interval
    is every effect the reshuffling does not reject
  engine: local_randomisation
  params: &id001
    statistic: diffmeans
    reps: 1000
    alpha: 0.05
    seed: 7
  fuzzy: false
  applies_when:
    kind:
    - sharp
  estimand: effect_in_window
  assumes: within the window, which side of the line a unit fell on is as good as
    random, so the sides are alike in everything but the change
  weak_when: the window holds few units, so the interval is wide; or no predetermined
    covariate exists to choose the window by balance, so the window is the support-points
    one
  prefer_over: &id002
    local_linear: with few distinct scores the local polynomial's bandwidth selector
      is not appropriate (Extensions 4.2); the local randomisation approach compares
      the units nearest the line directly
  rank: 0
local_randomisation_fuzzy:
  in_words: Anderson-Rubin test inversion for the receipt effect inside the frozen
    window
  engine: local_randomisation
  params: *id001
  fuzzy: true
  applies_when:
    kind:
    - fuzzy
  estimand: complier_effect_in_window
  assumes: within the window, which side of the line a unit fell on is as good as
    random, so the sides are alike in everything but the change
  weak_when: the window holds few units, so the interval is wide; or no predetermined
    covariate exists to choose the window by balance, so the window is the support-points
    one
  prefer_over: *id002
  rank: 0
local_randomisation_itt:
  in_words: eligibility effect inside the frozen window, without dividing by receipt
  engine: local_randomisation
  params: *id001
  fuzzy: false
  applies_when:
    kind:
    - fuzzy
  estimand: itt_in_window
  assumes: within the window, which side of the line a unit fell on is as good as
    random, so the sides are alike in everything but the change
  weak_when: the window holds few units, so the interval is wide; or no predetermined
    covariate exists to choose the window by balance, so the window is the support-points
    one
  prefer_over: *id002
  rank: 0
