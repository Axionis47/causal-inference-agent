cluster_few:
  in_words: the dataset declares an entity observed more than once, and there are
    few of them; the cluster-robust variance with the Bell-McCaffrey correction (cr2),
    which the library gives for few clusters
  source: Bell and McCaffrey (2002) for the correction; below 30 clusters as the line
    is ours
  applies_when:
    cluster_column: true
    clusters_max: 29
  vce: cr2
  cluster: entity
cluster_entity:
  in_words: the dataset declares an entity observed more than once (a state with many
    elections, a school with many students); errors cluster within it, and the library
    switches its variance to cluster-robust
  applies_when:
    cluster_column: true
  vce: cr1
  cluster: entity
robust_bc:
  in_words: independent rows; nearest-neighbour variance with three matches, robust
    bias-corrected interval
  applies_when:
    cluster_column: false
  vce: nn
  cluster: null
