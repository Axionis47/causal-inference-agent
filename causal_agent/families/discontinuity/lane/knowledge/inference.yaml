# How uncertainty is computed. Chosen by facts from the shape step, never by the model.
# Order matters: the first entry whose applies_when holds is used. applies_when is keyed on facts: cluster_column
# (whether the dataset declares an entity observed more than once) and clusters (how many distinct ones the primary rows hold).
# The point estimate comes from the library's Conventional row and the interval and p-value from its Robust row
# (bias-corrected estimate with the robust standard error), the convention of Calonico, Cattaneo and Titiunik (2014) and of
# the Foundations chapter 4.3; the rows are constants in the adapter. The library's final vce string is read back and recorded.

cluster_few:
  in_words: the dataset declares an entity observed more than once, and there are few of them; the cluster-robust variance with the Bell-McCaffrey correction (cr2), which the library gives for few clusters
  source: Bell and McCaffrey (2002) for the correction; below 30 clusters as the line is ours
  applies_when: {cluster_column: true, clusters_max: 29}
  vce: cr2
  cluster: entity

cluster_entity:
  in_words: the dataset declares an entity observed more than once (a state with many elections, a school with many students); errors cluster within it, and the library switches its variance to cluster-robust
  applies_when: {cluster_column: true}
  vce: nn
  cluster: entity

robust_bc:
  in_words: independent rows; nearest-neighbour variance with three matches, robust bias-corrected interval
  applies_when: {cluster_column: false}
  vce: nn
  cluster: null
