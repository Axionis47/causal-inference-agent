endpoints:
- id: sharp_local_polynomial
  title: Sharp local polynomial
  targets:
  - effect_at_cutoff
  configuration:
    framework: continuity
    kind: sharp
    estimand: effect_at_cutoff
  requirements:
  - id: target_locality
    address: claim:target.locality
    values:
    - cutoff
    - window
  - id: rule
    address: claim:assignment.kind
  - id: score
    address: claim:assignment.score_column
  - id: cutoff
    address: claim:assignment.cutoff
  - id: side
    address: claim:assignment.treated_side
  - id: equality
    address: claim:assignment.cutoff_value_treated
  - id: timing
    address: col:<score>.when
  - id: movability
    address: claim:assignment.movable
  - id: other_changes
    address: claim:cutoff_only.believed
    values:
    - true
  - id: unit
    address: claim:grain.row_is
  - id: sampling
    address: claim:sampling.how
  - id: compliance
    address: claim:assignment.compliance
    values:
    - sharp
  assumptions:
  - no coincident intervention confounds the contrast
  - no selective score manipulation
  - potential-outcome regression functions are continuous at the cutoff
  trajectory:
  - load
  - validate_context
  - seed
  - score
  - shape_table
  - covariates
  - density
  - balance
  - line
  - assumptions
  - rivals
  - check_candidates
  - freeze_designs
  checks:
  - sides
  - support
  - density
  - covariate_continuity
  estimators:
  - local_linear
  inference:
  - robust_bc
  - cluster_entity
  - cluster_few
  terminal_failures:
  - context_deficiency
  - invalid_rule
  - insufficient_support
  - assumptions_rejected
  - engine_failure
  activation:
    claim:assignment.kind:
    - cutoff_rule
    claim:assignment.compliance:
    - sharp
  executable: true
  scope_targets:
  - average
  - on_treated
  - local
  activation_required: true
