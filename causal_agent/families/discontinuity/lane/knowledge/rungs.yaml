# The discontinuity lane's ladder, declared once (ADR 0011). Every node of the graph in the order it runs: what decides it
# (`decider`: code, pack, judgement or ask, each with when), where it goes on (`exits`; the next rung when not said), whether
# it may stop (`stop`; yes when not said), the function in nodes.py that picks among several exits (`route`), whether it is
# a worker reached by Send (`worker`), a judgement's tool budget, the addresses it may ask back (`asks`) and the declared
# causes it stops on (`stops_on`). feasibility, figures and assemble are the builder's nodes. The graph is held to this
# file by a test; `make ladder` writes docs/ladders/discontinuity.md from it, the checks and the beliefs. This lane declares
# its space in its own step of ADR 0011; until then its answers are not enumerated.

goal: freeze_design

loops:  # the cycle the graph still has; ADR 0011 rule 6 takes it out
  - {from: estimate, to: pick_estimator, max: 1, why: a second pick when the estimator failed to fit}

rungs:
  - name: load
    level: the file
    decider: {code: always}
    stops_on: [intake, shape]
  - name: case
    level: the pack weighed
    decider: {code: always}
    stop: false
  - name: score
    level: the score and the line
    decider: {pack: the score column and the cutoff are confirmed, ask: the pack names the rule and not its column or its cutoff, judgement: otherwise}
    budget: 2
    tools: [describe, by_arm, association, redundancy, cells, timing, by_side_near, score_histogram]
    asks: [claim:assignment.score_column, claim:assignment.cutoff]
  - name: shape_table
    level: the table at the line
    decider: {code: always}
    stops_on: [shape]
  - name: density
    level: the evidence
    decider: {code: always}
    stop: false
  - name: line
    level: what the line decides
    decider: {judgement: always}
    budget: 4
    tools: [describe, by_arm, association, redundancy, cells, timing, by_side_near, score_histogram]
  - name: balance
    level: the evidence
    decider: {code: always}
    stop: false
  - name: covariates
    level: what else differs at the line
    decider: {pack: a column whose claims are confirmed, judgement: every other candidate}
    budget: 8
    tools: [describe, by_arm, association, redundancy, cells, timing, by_side_near, score_histogram]
  - name: merge_covariates
    level: the design
    decider: {code: a pure function of the rungs below}
    stop: false
  - name: verify
    level: the design
    decider: {code: always}
    stops_on: [graph]
  - name: heterogeneity
    level: where the effect differs
    decider: {code: no candidate, judgement: candidates exist}
    budget: 4
    tools: [describe, by_arm, association, redundancy, cells, timing, by_side_near, score_histogram]
  - name: threats
    level: the risks
    decider: {code: always}
    stop: false
  - name: check_design
    level: the checks
    decider: {code: always}
    stop: false
    exits: [assess, pick_estimator]
    route: after_checks
  - name: assess
    level: the assessment
    decider: {code: beliefs.yaml decides a stop or a question before any judgement, ask: a belief rule asks, judgement: a flag stands}
    budget: 0
    exits: [pick_estimator]
    stops_on: [checks, beliefs, threats, assessment]
  - name: pick_estimator
    level: the pick
    decider: {judgement: always}
    budget: 0
  - name: window
    level: the width
    decider: {code: one selector applies, judgement: several apply}
    budget: 2
    tools: [describe, by_arm, association, redundancy, cells, timing, by_side_near, score_histogram]
  - name: freeze_design
    level: the design
    decider: {code: always}
    stop: false
  - name: estimate
    level: the estimate
    decider: {code: always}
    exits: [placebo, interpret, pick_estimator]
    stops_on: [engine]
  - name: placebo
    level: the estimate
    decider: {code: always}
    worker: true
    stop: false
    exits: [interpret]
  - name: interpret
    level: the answer
    decider: {judgement: always}
    budget: 0
    stop: false
    exits: [figures]
