# The adjustment family: what it answers, what it needs, what it assumes. Written as method knowledge the routing reads
# and judges the data against, never as rules the harness evaluates. `needs_claims` is read by code for the fit grid.

applies_to: [effect_of_change]
answers: effect of a change on an outcome when the things that drove the change are measured in the data
needs:
  - the change is recorded as a column that differs across rows
  - the note says what the decision to make the change depended on, and those things are columns; or the note says the change was assigned at random, in which case it depended on nothing and this is met
  - the outcome is measured at or after the change, not before
  - overlap exists, meaning among rows with the same values of the things the decision depended on, some got the change and some did not; met by construction if assignment was random; unmet if the change is a strict function of those things, or the thing it depended on is the same label as the change itself
look_for: a column note saying the value was a decision and naming what it depended on, and whether uptake was voluntary after that; a change card describing who was offered it; profile top_values showing both arms present
assumes: nothing unmeasured drove both the change and the outcome
weak_when: the notes say the change was assigned by a strict mechanical rule with no voluntary element, so nobody with the same inputs went the other way; or the change reached whole groups at once and what separates the groups is not in the data. If the notes describe voluntary uptake after an offer, neither applies.
prefer_over: {}
convince: both arms are present at every level of what the offer depended on, so like is compared with like
specialist: dowhy
status: built

# The decisions the Designer fills for this family, each with the addresses it should rest on. From ADR 0006.
decisions:
  - name: who_is_treated
    asks: who is treated, versus whom
    rests_on: [claim:assignment.treatment_column, claim:assignment.treated_level, claim:sampling.how]
  - name: road
    asks: "the road: back door, front door, or instrument"
    rests_on: [claim:unobserved.exists, claim:exclusion.exists, claim:exclusion.column, claim:mediator.exists, claim:mediator.column]
  - name: adjustment_set
    asks: what enters the adjustment set
    rests_on: [claim:assignment.depends_on, "col:<column>.when", "col:<column>.moved_by_change", "col:<column>.stands_for"]
  - name: forbidden
    asks: what is forbidden
    rests_on: ["col:<column>.when", "col:<column>.moved_by_change", "col:<column>.measures_outcome"]
  - name: target
    asks: "the target: the average effect or the effect on the treated, from how the change was assigned and the question's scope"
    rests_on: [claim:assignment.kind]
  - name: run_at_all
    asks: whether to run at all
    rests_on: [probe:adjustment.overlap, claim:spillover.possible, claim:missing.why]

needs_claims:
    requires: [grain, sampling, change, assignment, measured, missing, unobserved, spillover]
    fits:
      assignment.kind: [lottery, own_choice, third_party, cutoff_rule, date_by_others]
