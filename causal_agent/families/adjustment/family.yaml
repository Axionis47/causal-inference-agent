applies_to:
- effect_of_change
answers: total, local, conditional, natural direct or natural indirect effects using
  observed adjustment, a valid instrument, or a mediator with explicit identifying
  assumptions
needs:
- one treatment and one outcome with their meanings, timing, comparison and population
  recorded
- an assignment account and the declared endpoint-specific assumptions supplied by
  the person
- the required measured columns and sufficient support for the selected strategy
look_for: a column note saying the value was a decision and naming what it depended
  on, and whether uptake was voluntary after that; a change card describing who was
  offered it; profile top_values showing both arms present
assumes: the specific observed-adjustment, instrument or mediation assumptions declared
  by the admitted endpoint
weak_when: the context leaves an identifying mechanism or target unresolved, data
  support is insufficient, or only an unimplemented identification formula exists
prefer_over: {}
convince: both arms are present at every level of what the offer depended on, so like
  is compared with like
specialist: dowhy
status: built
needs_claims:
  fits:
    assignment.kind:
    - lottery
    - own_choice
    - third_party
    - cutoff_rule
    - date_by_others
