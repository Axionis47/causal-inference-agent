goal: freeze_design
loops:
- from: rivals
  to: relate
  max: 1
  why: every candidate graph is invalid before any outcome effect is seen
rungs:
- name: load
  level: admitted context and table
  decider:
    code: always
  stops_on:
  - intake
  - shape
- name: case
  level: evidence classifications
  decider:
    code: always
  stop: false
- name: pair
  level: treatment comparisons
  decider:
    pack: observed confirmed treatment comparison
    judgement: otherwise
  budget: 2
  tools:
  - describe
- name: seed
  level: immutable source assertions
  decider:
    code: always
  stop: false
- name: mechanism
  level: assignment mechanism
  decider:
    judgement: always
  budget: 4
  tools:
  - describe
  - cells
  - association
- name: relate
  level: relationship hypotheses
  decider:
    judgement: always
  budget: 8
  tools:
  - describe
  - association
  - redundancy
  - timing
- name: probe
  level: load-bearing uncertainty
  decider:
    judgement: unresolved relationships only
    code: no uncertainty
  budget: 4
  tools:
  - describe
  - association
  - redundancy
  - timing
  stop: false
- name: rivals
  level: identification endpoints
  decider:
    code: always
  exits:
  - relate
  - check_design
  stops_on:
  - graph
- name: check_design
  level: endpoint-specific checks
  decider:
    code: always
  stops_on:
  - checks
- name: pick_estimator
  level: eligible estimator per design
  decider:
    code: exactly one eligible estimator for a design
    judgement: several eligible estimators for a design
  budget: 0
- name: freeze_design
  level: fixed execution inputs
  decider:
    code: always
  stop: false
  exits:
  - analyse
  route: fan_out_analyse
- name: analyse
  level: estimation and diagnostics
  decider:
    code: always
  worker: true
  stop: false
- name: after_analyse
  level: execution status
  decider:
    code: always
  stops_on:
  - engine
- name: interpret
  level: target-aware explanation
  decider:
    judgement: any successful estimate
  budget: 0
  stop: false
