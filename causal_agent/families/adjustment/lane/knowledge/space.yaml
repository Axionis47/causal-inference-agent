dimensions:
  treatment:
    values: [binary_contrast]
    decided_by: pair
    unsupported: {continuous: dose response is outside the declared adjustment endpoints, multiple: multiple simultaneous treatments are not supported}
  outcome:
    values: [continuous, binary]
    decided_by: load
    unsupported: {other: outcome must be continuous numeric or explicitly encoded binary}
  endpoint:
    values: [total.unadjusted, total.backdoor, total.general_adjustment, iv.wald_late, iv.linear_single, iv.linear_multiple, iv.linear_conditional, frontdoor.linear_total, mediation.linear_nie, mediation.linear_nde, adjustment.linear_conditional, structural.zero]
    decided_by: rivals
  contrasts:
    range: [1, 11]
    decided_by: pair
    unsupported: {above: more than twelve treatment levels requires a dose or multicategory design outside this lane}
  modifiers:
    range: [0, 3]
    decided_by: rivals
unsupported:
  - {when: {endpoint: frontdoor.linear_total, outcome: binary}, reason: the frontdoor linear adapter requires continuous outcome}
  - {when: {endpoint: mediation.linear_nie, outcome: binary}, reason: natural indirect effects support additive continuous models only}
  - {when: {endpoint: mediation.linear_nde, outcome: binary}, reason: natural direct effects support additive continuous models only}
  - {when: {endpoint: adjustment.linear_conditional, outcome: binary}, reason: conditional effects support continuous linear interaction models only}
