linear_regression:
  method: backdoor.linear_regression
  endpoints:
  - total.unadjusted
  - total.backdoor
  targets:
  - ate
  outcomes:
  - continuous
  rank: 3
  in_words: average intervention contrast from a linear outcome model
  assumes: additive linear outcome model
  params: {}
generalized_linear_model:
  method: backdoor.generalized_linear_model
  endpoints:
  - total.unadjusted
  - total.backdoor
  targets:
  - ate
  outcomes:
  - binary
  rank: 2
  in_words: average probability contrast from a logistic outcome model
  assumes: linear log odds
  params:
    glm_family: binomial
    predict_score: true
propensity_score_stratification:
  method: backdoor.propensity_score_stratification
  endpoints:
  - total.backdoor
  targets:
  - ate
  - att
  - atc
  outcomes:
  - continuous
  - binary
  rank: 1
  in_words: compare units using treatment propensity estimated from the adjustment
    set
  assumes: valid propensity model and sufficient common support
  params:
    num_strata: auto
    clipping_threshold: 10
propensity_score_weighting:
  method: backdoor.propensity_score_weighting
  endpoints:
  - total.backdoor
  targets:
  - ate
  - att
  - atc
  outcomes:
  - continuous
  - binary
  rank: 2
  in_words: compare units using treatment propensity estimated from the adjustment
    set
  assumes: valid propensity model and sufficient common support
  params:
    weighting_scheme: ips_weight
    min_ps_score: 0.05
    max_ps_score: 0.95
propensity_score_matching:
  method: backdoor.propensity_score_matching
  endpoints:
  - total.backdoor
  targets:
  - ate
  - att
  - atc
  outcomes:
  - continuous
  - binary
  rank: 4
  in_words: compare units using treatment propensity estimated from the adjustment
    set
  assumes: valid propensity model and sufficient common support
  params: {}
general_linear:
  method: general_adjustment.linear_regression
  endpoints:
  - total.general_adjustment
  targets:
  - ate
  outcomes:
  - continuous
  rank: 3
  in_words: linear regression with a general adjustment certificate
  assumes: additive linear model
  params: {}
general_glm:
  method: general_adjustment.generalized_linear_model
  endpoints:
  - total.general_adjustment
  targets:
  - ate
  outcomes:
  - binary
  rank: 2
  in_words: logistic average probability contrast with a general adjustment certificate
  assumes: linear log odds
  params:
    glm_family: binomial
    predict_score: true
wald:
  method: iv.instrumental_variable
  endpoints:
  - iv.wald_late
  targets:
  - late
  outcomes:
  - continuous
  - binary
  rank: 1
  in_words: binary instrument Wald contrast on compliers
  assumes: exclusion, exogeneity and monotonicity
  params: {}
instrumental_variable:
  method: iv.instrumental_variable
  endpoints:
  - iv.linear_single
  targets:
  - ate
  outcomes:
  - continuous
  - binary
  rank: 1
  in_words: scalar IV effect under a homogeneous additive structural model
  assumes: exogeneity, exclusion, relevance and constant effect
  params: {}
iv_2sls:
  method: statsmodels.iv2sls
  endpoints:
  - iv.linear_multiple
  - iv.linear_conditional
  targets:
  - ate
  outcomes:
  - continuous
  - binary
  rank: 1
  in_words: 2SLS with explicit intercept, exogenous controls and excluded instruments
  assumes: conditional exogeneity, exclusion, rank and constant additive effect
  params: {}
frontdoor_two_stage:
  method: frontdoor.two_stage_regression
  endpoints:
  - frontdoor.linear_total
  targets:
  - ate
  outcomes:
  - continuous
  rank: 1
  in_words: linear two-stage singleton frontdoor total effect
  assumes: frontdoor criterion and linear additive stages
  params: {}
mediation_two_stage:
  method: mediation.two_stage_regression
  endpoints:
  - mediation.linear_nie
  - mediation.linear_nde
  targets:
  - nie
  - nde
  outcomes:
  - continuous
  rank: 1
  in_words: singleton additive linear natural direct or indirect effect
  assumes: sequential ignorability, no treatment-induced mediator confounding and
    no treatment-mediator interaction
  params: {}
linear_interaction:
  method: backdoor.linear_regression
  endpoints:
  - adjustment.linear_conditional
  targets:
  - conditional
  outcomes:
  - continuous
  rank: 1
  in_words: linear treatment interactions with baseline modifiers
  assumes: linear conditional outcome model and support
  params: {}
general_linear_interaction:
  method: general_adjustment.linear_regression
  endpoints:
  - adjustment.linear_conditional
  targets:
  - conditional
  outcomes:
  - continuous
  rank: 2
  in_words: general adjustment linear baseline modifier interactions
  assumes: linear conditional model
  params: {}
structural_zero:
  method: structural.zero
  endpoints:
  - structural.zero
  targets:
  - ate
  outcomes:
  - continuous
  - binary
  rank: 1
  in_words: zero implied by absence of every directed causal path
  assumes: the stated DAG is the causal model
  params: {}
