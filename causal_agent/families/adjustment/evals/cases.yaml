- id: students_prep_course
  dataset: students
  question: Did completing the prep course raise math scores?
  expected:
    status: done
    adjustment_set_contains:
    - lunch
    - parental_level_of_education
    not_in_graph:
    - reading_score
    - writing_score
    estimator_in:
    - propensity_score_stratification
    - propensity_score_weighting
    - propensity_score_matching
    - linear_regression
    effect_sign:
      completed_vs_none: positive
    placebo_passes: true
- id: marketing_three_promotions
  dataset: marketing
  question: Which of the three promotions produced the highest weekly sales?
  expected:
    status: done
    contrasts: 3
    adjustment_set_subset_of:
    - marketsize
    - ageofstore
    - marketid
    - week
    estimator_in:
    - linear_regression
    - propensity_score_stratification
    - propensity_score_weighting
    - propensity_score_matching
    effect_sign:
      2_vs_1: negative
      3_vs_2: positive
    placebo_passes: true
- id: gov_transfers_forced_adjustment
  dataset: gov_transfers
