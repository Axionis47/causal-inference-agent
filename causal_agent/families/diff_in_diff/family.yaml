applies_to:
- effect_of_change
answers: effect of a change that reached some units and not others, comparing how
  outcomes moved over time in each group
needs:
- units observed over time or paired outcome measurements before and after
- treated observations have never-treated or not-yet-treated comparisons on the declared
  temporal support
- the outcome exists before and after adoption
- an explicit study account supports the conditional or unconditional parallel-trends
  assumption
look_for: a time column or two dated measures of the outcome in the column notes;
  a change card naming who got it and who did not
assumes: without the change, the treated and untreated groups would have moved in
  parallel, and units do not affect each other's outcomes
weak_when: assignment follows outcome trends; unsupported anticipation, spillover
  or concurrent differential shocks; few independent assignment clusters; no valid
  untreated comparison on the requested horizon
prefer_over:
  adjustment: when the change was given to whole groups by a group label such as a
    state or region, adjusting for that label leaves nothing to compare, because every
    unit with the label got the change; a measure of the outcome from before the change
    lets diff_in_diff difference the group gap away instead
convince: show the pre-change paths, untreated comparison support and the assumptions
  each frozen target requires
specialist: pyfixest
status: built
needs_claims:
  fits:
    grain.panel:
    - true
    assignment.kind:
    - date_by_others
    - third_party
    - own_choice
