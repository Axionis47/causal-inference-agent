# Design checks run after the canonical table exists, before any estimate. Numbers are declarations.
# hard: the design cannot proceed as it stands.  soft: proceed is allowed, the model must acknowledge it.

units:
  min_per_group: {hard: 1, soft: 10}      # treated or control units below soft is thin; below hard is no comparison

periods:
  parallel_untestable_when_pre: 1         # one pre period: the parallel-trends assumption cannot be checked (soft)

pre_trends:
  # joint test that every pre-period coefficient of the dynamic model is zero; computed when pre >= 2
  p_value: {soft: 0.10, hard: 0.01}

adoption:
  staggered_is_hard: true                 # more than one first-treated period stops the built path until staggered entries are wired

# hand-off scope target -> what diff-in-diff identifies
target_units:
  average: att
  on_treated: att

# interpretation gate: the stated effect must match the estimate within this relative tolerance
effect_tolerance: 0.01

# What each check asks, in the question's words. The lane puts this before the number on every check line the
# interpretation and the brief read. No dataset name here.
in_words:
  units: "how many units got the change and how many are compared against them"
  single_treated_unit: "whether only one unit got the change, so the usual standard errors mean little"
  parallel_untestable: "whether there is more than one period before the change to see if the groups moved together"
  pre_trends: "whether the two groups were already moving apart before the change"
  staggered: "whether units got the change at different times"

# How many tool calls each reasoning episode may make before it must answer. The leash, declared.
episode_budget:
  groups: 2
  periods: 2
  comparison: 6
  controls: 8
  heterogeneity: 4

# How many modifiers the heterogeneity rung may name; the effect is estimated within each level of each, a unit trait.
modifiers:
  max: 3
  max_levels: 4
  min_units_per_group: 2   # a level with fewer treated or control units than this is recorded as too thin, not estimated
