twfe_static:
  engine: feols
  aggregation:
  - pooled
  endpoints:
  - paired_two_wave_att
  - common_adoption_projection_effect
  rank: 1
  in_words: static common adoption projection with frozen controls
twfe_dynamic:
  engine: feols
  aggregation:
  - horizon
  - horizon_profile
  endpoints:
  - common_adoption_projection_effect
  rank: 1
  in_words: one coefficient per supported post horizon
did2s:
  engine: did2s
  aggregation:
  - pooled
  endpoints:
  - untreated_imputation_att
  - untreated_prefix_imputation_att
  rank: 1
  in_words: mean treated-cell residual after untreated-only unit/time model
did2s_dynamic:
  engine: did2s
  aggregation:
  - horizon
  - horizon_profile
  endpoints:
  - untreated_imputation_att
  - untreated_prefix_imputation_att
  rank: 1
  in_words: mean imputed effect within each supported horizon
did2s_cohort:
  engine: did2s
  aggregation:
  - cohort
  - cohort_profile
  endpoints:
  - untreated_imputation_att
  - untreated_prefix_imputation_att
  rank: 1
  in_words: mean imputed effect within each supported cohort
saturated_event_study:
  engine: saturated
  aggregation:
  - pooled
  - horizon
  - horizon_profile
  - cohort
  - cohort_profile
  - cohort_horizon
  endpoints:
  - never_cohort_cell_att
  rank: 1
  in_words: never-treated comparison with frozen cohort-horizon coefficient weights
lpdid:
  engine: lpdid
  aggregation:
  - pooled
  - horizon
  - horizon_profile
  endpoints:
  - clean_projection_att
  rank: 1
  in_words: clean controls remain untreated through each frozen horizon; no covariates
