# Falsification runs after the estimate. Every entry whose applies_when holds runs; no choice is made. applies_when is keyed
# on facts of the frozen design and matched by one rule: units, units_treated, periods_pre, cohorts, engine (the estimator's
# library surface), placebo_outcome_columns (pre-treatment numeric columns that move within a unit), group_column_exists (a
# level above the unit rides in the panel). kind: falsification carries a verdict under pass_when; kind: sensitivity reports a
# range and no verdict. Draw counts are budgets, not judgements. Seeds are set once in the adapter. Every refit carries the
# design's controls: a placebo tests the design as frozen, not a barer one.

placebo_group:
  kind: falsification
  in_words: reassign the treated label at random across units and refit the design; the p-value is the share of reassignments whose effect is at least as large as the observed one
  source: Bertrand, Duflo and Mullainathan (2004); the two hundred draws are ours
  applies_when: {units_min: 5, cohorts: [1], engine: [feols]}
  params: {draws: 200}
  pass_when: {p_value_lt: 0.05, informative_only_when_primary_excludes_zero: true}
  note: a true null passes as uninformative, never as a failure

placebo_timing:
  kind: falsification
  in_words: pretend the change happened in the middle of the pre period, fit the design on pre-period rows only; the effect should be about zero
  source: the standard placebo-in-time; the middle cut is ours
  applies_when: {periods_pre_min: 3, engine: [feols]}
  params: {cut: middle}
  pass_when: {interval_covers_zero: true}

placebo_outcome:
  kind: falsification
  in_words: a column the change could not have moved, fixed before it, used as the outcome; the design should find no effect on it
  source: the standard placebo outcome; at most two columns is ours
  applies_when: {placebo_outcome_columns_min: 1, engine: [feols]}
  params: {max_columns: 2}
  pass_when: {interval_covers_zero: true}

leave_one_out:
  kind: falsification
  in_words: drop each treated unit in turn and refit the design; no single unit should carry the conclusion
  source: the standard leave-one-out; the range of two to twenty treated units is ours
  applies_when: {units_treated_min: 2, units_treated_max: 20, engine: [feols]}
  pass_when: {interval_overlaps_primary: true, sign_stable_when_primary_excludes_zero: true}

anticipation_shift:
  kind: falsification
  in_words: move the change earlier by the lead below (past any anticipation window the design left out), on the rows before the real change only; an effect there means units moved before the change
  source: the standard lead test; one period past the window is ours
  applies_when: {periods_pre_min: 3, engine: [feols]}
  params: {lead: 1}
  pass_when: {interval_covers_zero: true}

unit_trends:
  kind: sensitivity
  in_words: the design refit with a straight-line trend per unit; how far the estimate moves says how much it rests on the paths being parallel rather than merely linear
  source: unit-specific linear trends as a robustness check; a growing effect is partly read as trend, which is why this is a sensitivity and not the design
  applies_when: {periods_pre_min: 3, engine: [feols]}

group_time_fe:
  kind: sensitivity
  in_words: the design refit with period effects per group above the unit, so only movement within a group identifies the effect
  source: group-by-period fixed effects as a robustness check; ours
  applies_when: {group_column_exists: [true], engine: [feols]}

twfe_naive:
  kind: sensitivity
  in_words: two-way fixed effects on the staggered panel, the estimator the design did not use, to show how far its bias would have carried the answer
  source: Goodman-Bacon (2021) on the bias of two-way fixed effects under staggered adoption
  applies_when: {cohorts_min: 2}
