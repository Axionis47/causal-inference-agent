  - support
  - cluster
  - rank
  - pre_trends
  estimators:
  - twfe_static
  inference:
  - row_robust
  - cluster_crv1
  - wild_webb
  - wild_rademacher
  - inference_unavailable
  terminal_failures:
  - context_deficiency
  - unidentified_effect
  - unsupported_method
  - inadequate_support
  - exhausted_reasoning
  - execution_failure
  scope_targets:
  - on_treated
  - average
  activation:
    claim:grain.layout:
