- case_id: synthetic-iv-late
  tier: secondary
  question_type: iv
  source:
    kaggle_slug: synthetic
    data_file: synthetic_iv.csv (generated)
    synthetic_eval_fixture: true
    verified: false
    n_rows: 5000
    synthetic_recipe: 'seed=47, n=5000. U~N(0,1) latent. Compliance type: sample p_always=expit(-2.2+0.8*U),
      p_never=expit(-2.2-0.8*U) per unit, type in {always,never,complier} (no defiers => monotonicity);
      calibrated to ~60% compliers. Z~Bernoulli(0.5) independent of everything. X = 1 for always-takers,
      0 for never-takers, Z for compliers. C1~N(0,1), C2~Bernoulli(0.4). Y = 2.0*X + 1.5*U + 0.8*C1 +
      0.5*C2 + N(0,1). True LATE = ATE = 2.0 (constant effect). U drives both type (hence X) and Y, so
      OLS of Y on X is biased upward; Wald = (E[Y|Z=1]-E[Y|Z=0]) / (E[X|Z=1]-E[X|Z=0]) recovers 2.0. Save
      z,x,y,c1,c2 only (drop U, type).'
  causal_question: An encouragement (z) was randomly assigned; uptake of the program (x) was voluntary.
    What is the causal effect of the program on outcome y for those induced to take it up?
  expected_fields:
    instrument: z
    treatment: x
    outcome: y
    confounders:
    - c1
    - c2
  expected_lane: instrumental_variables
  expected_disabled_lanes:
  - lane: naive_ols
    reason: unobserved U confounds x and y by construction; naive estimate is biased upward (~2.5 vs true
      2.0)
  min_assertions:
  - IV/Wald or 2SLS estimate within [1.8, 2.2] (true LATE = ATE = 2.0 by constant-effect construction)
  - first-stage compliance rate ~0.6 detected (F >> 100 at n=5000)
  - naive difference-in-means / OLS estimate exceeds the IV estimate (upward confounding bias built in)
