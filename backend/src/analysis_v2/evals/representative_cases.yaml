manifest_version: 1
purpose: Representative eval cases for the analysis slice. Real datasets assert structure, lane selection,
  direction, and published benchmarks; synthetic_eval_fixture cases assert magnitudes against generated
  ground truth. Never hardcode these column names outside evals/.
taxonomy:
  type_1: simple_effect
  type_2: binary_treatment
  type_3: dose_response
  type_4: multi_factor
  type_5: interaction
  type_6: mediation
  type_7: did
  type_8: rdd
  type_9: iv
  type_10: time_series_intervention
  type_11: survival
  type_12: before_after
  type_13: heterogeneous_effects
  type_14: driver_analysis
  type_15: no_effect
  type_16: mechanism_search
cases:
- case_id: lalonde-nsw-experimental
  tier: secondary
  question_type: simple_effect
  source:
    kaggle_slug: wakizashe/lalonde-1986-nsw-dataset
    data_file: lalonde_nsw (1).csv
    synthetic_eval_fixture: false
    verified: true
    n_rows: 445
  causal_question: In the NSW randomized experiment, what is the effect of job training (treat) on 1978
    earnings (re78)?
  expected_fields:
    treatment: treat
    outcome: re78
    confounders:
    - age
    - educ
    - black
    - hisp
    - marr
    - nodegree
    - re74
    - re75
  expected_lane: observational/matching (or RCT-style simple comparison; covariates are balanced, re74
    $2,096 vs $2,107)
  expected_disabled_lanes:
  - lane: IV
    reason: no instrument column
  - lane: RDD
    reason: no running variable or cutoff
  - lane: DiD/panel
    reason: single cross-section, no time index
  min_assertions:
  - identifies treat as treatment and re78 as outcome
  - estimated ATE is positive, roughly $1,000-$2,500 (experimental truth $1,794)
  - adjusted estimate stays close to the naive difference (covariates balanced), no sign flip
  - effect reported as statistically meaningful (CI excludes large negative values)
  notes: 'Kaggle upload is new (0 downloads) but the data is the canonical 445-row experimental sample;
    naive diff computed = $1,794.34 exactly matching the literature. Good ground-truth anchor since the
    true ATE is experimentally known. Filename contains a space and parentheses: ''lalonde_nsw (1).csv''.'
- case_id: lalonde-observational
  tier: primary
  question_type: binary_treatment
  source:
    kaggle_slug: samuelzakouri/lalonde
    data_file: lalonde.csv
    synthetic_eval_fixture: false
    verified: true
    n_rows: 614
  causal_question: Does participating in the job training program (treat) increase 1978 earnings (re78)?
  expected_fields:
    treatment: treat
    outcome: re78
    confounders:
    - age
    - educ
    - black
    - hispan
    - married
    - nodegree
    - re74
    - re75
  expected_lane: observational/matching
  expected_disabled_lanes:
  - lane: RCT/naive difference
    reason: 'treated and PSID controls are non-comparable (re74: $2,096 vs $5,619); naive diff is -$635,
      wrong sign'
  - lane: IV
    reason: no instrument column
  - lane: RDD
    reason: no running variable or cutoff
  - lane: DiD/panel
    reason: single cross-section outcome, no unit-time panel structure
  min_assertions:
  - identifies treat as binary treatment and re78 as continuous outcome
  - adjustment set includes pre-treatment earnings re74 and re75
  - 'Unnamed: 0 index column is not selected as a confounder or covariate'
  - naive difference in means is negative (~ -$635)
  - adjusted/matched ATT is positive, roughly in $500-$3,000 (sign flip vs naive)
  - lane chosen is observational adjustment (matching/PSM/IPW/regression adjustment), not naive comparison
  notes: Classic confounding benchmark; 581 downloads, CC0. The headline behavior to test is the naive-negative
    -> adjusted-positive sign flip. Experimental benchmark ATT ~ $1,794.
