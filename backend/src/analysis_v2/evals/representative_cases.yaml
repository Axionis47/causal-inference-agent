    verified: true
    n_rows: 2167
    synthetic_recipe: 'Base: bobnau/daily-website-visitors, parse with pd.read_csv(..., thousands='',''),
      parse Date. Keep balanced window 2018-04-01 <= Date < 2020-04-01 (365 pre / 366 post days around
      cut 2019-04-01). Generate visits = round(Unique.Visits * step * noise) where step = 1.25 if Date
      >= 2019-04-01 else 1.0, noise ~ Normal(1.0, 0.02) with np.random.default_rng(42). Ground truth:
      exact +25% multiplicative level shift at 2019-04-01 by construction (real series is the counterfactual).
      Verified: pre mean 3147, post mean 3866, naive ratio 1.187 (truth 1.25; gap is the real series''
      0.951 organic drift, intentionally kept so naive before-after and proper ITS give distinguishable
      answers). Drop or keep Page.Loads etc. as decoys; rename injected column to ''visits''.'
  causal_question: The site shipped a redesign on 2019-04-01. Estimate the causal effect of the redesign
    on daily unique visits.
  expected_fields:
    outcome: visits (synthetic column derived from Unique.Visits)
    time: Date
    event: site redesign (stipulated in question)
    cutoff: '2019-04-01'
    confounders:
