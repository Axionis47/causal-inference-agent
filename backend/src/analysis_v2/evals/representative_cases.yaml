- case_id: marketing-ab
  tier: secondary
  question_type: binary_treatment
  source:
    kaggle_slug: faviovaz/marketing-ab-testing
    data_file: marketing_AB.csv
    synthetic_eval_fixture: false
    verified: true
    n_rows: 588101
  causal_question: Did showing users the ad (vs the public service announcement) increase conversion?
  expected_fields:
    treatment: test group
    outcome: converted
  expected_lane: randomized_experiment
  expected_disabled_lanes:
  - lane: iv
    reason: no instrument; assignment is randomized
  - lane: rdd
    reason: no running variable or cutoff
  - lane: did
    reason: no time/panel dimension
  min_assertions:
  - identifies ad/psa as a randomized A/B test with psa as control despite heavy 96/4 imbalance (564,577
    ad vs 23,524 psa)
  - 'ATE on converted is positive and significant: absolute lift in range +0.005 to +0.010 (point ~+0.0077,
    ~43% relative lift, z~8.7)'
  - does NOT adjust for 'total ads', 'most ads day', or 'most ads hour' as confounders; flags them as
    post-treatment exposure measures (or at minimum the estimate is not conditioned on them)
  - 'handles boolean outcome dtype and the junk ''Unnamed: 0'' index column without error'
  notes: '9,155 downloads / 75 votes; well-known. Zip is 5.2MB, CSV unzips to ~22MB. Main eval value beyond
    the ATE is the post-treatment-variable trap: a naive system that ''controls for total ads'' biases
    the estimate. HTE by most-ads-day/hour is NOT a valid type-13 question since those are post-treatment;
    use Hillstrom for HTE.'
- case_id: advertising-dose-response
  tier: primary
  question_type: dose_response
  source:
    kaggle_slug: yasserh/advertising-sales-dataset
    data_file: Advertising Budget and Sales.csv
    synthetic_eval_fixture: false
    verified: true
    n_rows: 200
  causal_question: Does more TV advertising spend increase sales?
  expected_fields:
    treatment: TV Ad Budget ($)
    outcome: Sales ($)
    confounders:
    - Radio Ad Budget ($)
    - Newspaper Ad Budget ($)
  expected_lane: observational (regression, continuous treatment)
  expected_disabled_lanes:
  - lane: rct/experimental
    reason: no randomization or assignment indicator; spend is observational
  - lane: iv
    reason: no plausible instrument column
  - lane: rdd
    reason: no cutoff or running variable
  - lane: did/panel
    reason: no time dimension; single cross-section of 200 markets
  min_assertions:
  - treatment is identified as the continuous TV ad budget column (exact name 'TV Ad Budget ($)', spaces
    and $ included), not arbitrarily dichotomized without saying so
  - outcome is 'Sales ($)'
  - lane chosen is observational regression; no experimental claim
  - TV partial effect is positive and significant (textbook OLS coef ~0.046 per unit, univariate ~0.0475)
  - in a multi-factor model, newspaper effect is reported as near zero / not significant (coef ~-0.001)
    while radio is positive (~0.19)
  - 'the ''Unnamed: 0'' index column is excluded from covariates'
  notes: 'Exact ISLR Advertising data (verified: OLS coefficients match textbook). 22.5k downloads, usability
    1.0. No nulls. Column names with spaces/$/parens are a realistic naming stressor. Also exercises type
    4 if asked about all three channels jointly.'
- case_id: habits-dose-response
  tier: secondary
  question_type: dose_response
  source:
    kaggle_slug: jayaantanaath/student-habits-vs-academic-performance
    data_file: student_habits_performance.csv
    synthetic_eval_fixture: false
    verified: true
    n_rows: 1000
  causal_question: Does studying more hours per day increase exam scores?
  expected_fields:
    treatment: study_hours_per_day
    outcome: exam_score
    confounders:
    - sleep_hours
    - attendance_percentage
    - mental_health_rating
    - parental_education_level
    - part_time_job
  expected_lane: observational (regression, continuous treatment)
  expected_disabled_lanes:
  - lane: rct/experimental
    reason: self-reported habits; no assignment
  - lane: iv
    reason: no instrument column
  - lane: rdd
    reason: no cutoff or running variable
  - lane: did/panel
    reason: single cross-section per student
  min_assertions:
  - treatment is continuous study_hours_per_day (range 0-8.3), outcome is exam_score (18.4-100)
  - dose-response slope is positive and large (adjusted OLS ~9.5 score points per extra daily hour; raw
    corr 0.825)
  - student_id is excluded from covariates
  - the 91 missing values in parental_education_level are handled without dropping the run
  - lane is observational regression
  notes: Kaggle-popular (67k downloads) but author-simulated data, so the strong clean signal is by construction;
    exam_score is capped at 100 (mild ceiling truncation). Useful as a larger-n, missing-data variant
    of type 3; do not treat its effect size as real-world ground truth.
- case_id: student-multi-factor
  tier: primary
  question_type: multi_factor
  source:
    kaggle_slug: devansodariya/student-performance-data
    data_file: student_data.csv
    synthetic_eval_fixture: false
    verified: true
    n_rows: 395
  causal_question: Do study time, absences, and past failures together affect a student's final grade
    (G3)?
  expected_fields:
    treatment: studytime (with absences and failures as co-factors in the multi-factor model)
    outcome: G3
    confounders:
    - Medu
    - Fedu
    - age
    - goout
    - schoolsup
    - famsup
    - higher
    - internet
  expected_lane: observational (regression)
  expected_disabled_lanes:
  - lane: rct/experimental
    reason: purely observational school survey; no assignment mechanism
  - lane: iv
    reason: no credible instrument among columns
  - lane: rdd
    reason: no cutoff rule in the data
  - lane: did/panel
    reason: single cross-section; G1/G2/G3 are within-course grades, not panel waves
  min_assertions:
  - outcome is G3 (final grade), not G1 or G2
  - failures has the largest-magnitude association among the three factors and is negative (joint OLS
    coef ~-2.2 per prior failure)
  - studytime association is positive but weak (joint OLS coef ~+0.2 per level; ordinal 1-4)
  - G1 and G2 are not included as confounders for these factors (they are post-treatment/intermediate
    grades)
  - lane is observational; conclusions framed as adjusted associations, not experimental effects
  - all three named factors (studytime, absences, failures) appear in the fitted model
  notes: 'Real UCI Cortez & Silva math-class data, 84.5k downloads. Trap built in: 38 students have G3==0
    (dropouts), which makes the raw absences-G3 correlation ~+0.03 (counterintuitive sign); failures dominates
    (corr -0.36). G1/G2 are a post-treatment-adjustment trap. The whenamancodes/student-performance mirror
    was rejected: its Maths.csv is malformed (non-UTF-8 bytes plus tokenization errors).'
- case_id: insurance-interaction
  tier: primary
  question_type: interaction
  source:
    kaggle_slug: mirichoi0218/insurance
    data_file: insurance.csv
    synthetic_eval_fixture: false
    verified: true
    n_rows: 1338
  causal_question: Does the effect of being a smoker on insurance charges depend on BMI? Quantify how
    the smoking premium changes for obese vs non-obese individuals.
  expected_fields:
    treatment: smoker
    outcome: charges
    group: bmi (or obese = bmi>=30)
    confounders:
    - age
    - children
    - sex
    - region
  expected_lane: effect_modification
  expected_disabled_lanes:
  - lane: mediation
    reason: Cross-sectional, no temporal ordering; smokers and non-smokers have near-identical mean BMI
      (30.65 vs 30.71), so BMI does not carry the smoking effect. No credible X->M->Y chain.
  - lane: instrumental_variable
    reason: No instrument available; all covariates plausibly affect charges directly.
  min_assertions:
  - An interaction term smoker x bmi (or smoker x obese) is estimated and is positive and statistically
    significant
  - The subgroup/conditional ATE of smoker is substantially larger for high-BMI (obese) than low-BMI individuals
    (effect modification present, ~$33k vs ~$13k)
  - The marginal ATE of smoker on charges is large and positive (order ~$20k-$24k)
  - The system reports heterogeneity by BMI rather than collapsing to a single homogeneous effect
  notes: 'Famous dataset (410k downloads, 3249 votes). Verified via pandas. smoker:bmi OLS coef +1433.8/BMI-unit,
    p=1.66e-129. Raw smoker mean-diff: $13,386 (non-obese) vs $32,715 (obese). Strong, clean effect modification.
    Explicitly NOT a mediation dataset.'
- case_id: synthetic-mediation
  tier: primary
  question_type: mediation
  source:
    kaggle_slug: synthetic
    data_file: mediation_fixture.csv (generated)
    synthetic_eval_fixture: true
    verified: false
    n_rows: 2000
    synthetic_recipe: 'numpy seed=42, n=2000. C ~ Normal(0,1). T ~ Bernoulli(0.5) (randomized, so T is
      unconfounded). M = 0.6*T + 0.4*C + Normal(0,1). Y = 0.5*M + 0.3*T + 0.5*C + Normal(0,1). Ground
      truth: a (T->M) = 0.6, b (M->Y | T,C) = 0.5, indirect = a*b = 0.30, direct = 0.30, total = 0.60,
      proportion mediated = 0.50. Correct recovery REQUIRES conditioning on C in the outcome regression
      (Y ~ M + T + C); omitting C biases b. This is the standard reason a real cross-sectional dataset
      cannot give clean mediation ground truth, so the fixture is the honest choice.'
  causal_question: Decompose the total effect of treatment T on outcome Y into a direct effect and an
    indirect effect operating through mediator M.
  expected_fields:
    treatment: T
    mediator: M
    outcome: Y
    confounders:
    - C
  expected_lane: mediation
  expected_disabled_lanes:
  - lane: instrumental_variable
    reason: T is randomized; no instrument needed and none present.
  - lane: regression_discontinuity
    reason: No running variable or cutoff in the DGP.
  min_assertions:
  - Reports a mediation decomposition where total effect = direct effect + indirect effect (additivity
    holds)
  - Indirect effect (T->M->Y) recovered close to ground-truth a*b = 0.30 within tolerance
  - Direct effect recovered close to ground-truth 0.30 within tolerance
  - Total effect recovered close to 0.60; proportion mediated close to 0.50
  - The mediator-outcome confounder C is adjusted for in the outcome model (omitting C biases the b path
    / indirect estimate)
  notes: 'No real Kaggle dataset cleanly supports mediation: insurance is contemporaneous (and BMI does
    not carry the smoking effect); Framingham (aasheesh200/framingham-heart-study-dataset, 4240 rows,
    smoking/sysBP/glucose/TenYearCHD) measures treatment and mediators at the same baseline visit, so
    mediator-after-treatment ordering is violated. Synthetic fixture gives a known direct/indirect split
    for exact-recovery assertions.'
- case_id: card-krueger-did
  tier: primary
  question_type: did
  source:
    kaggle_slug: harrywang/propensity-score-matching
    data_file: employment.csv
    synthetic_eval_fixture: false
    verified: true
    n_rows: 384
  causal_question: New Jersey raised its minimum wage from $4.25 to $5.05 in April 1992; Pennsylvania
    did not. Using fast-food restaurant employment measured in February (before) and November (after),
    did the minimum wage increase reduce employment in NJ relative to PA?
  expected_fields:
    group: state
    time: 'implicit wide format: total_emp_feb=pre, total_emp_nov=post (no time column; requires reshape
      or wide-DID handling)'
    treatment: state (1=NJ, exposed to wage increase)
    outcome: total_emp_nov vs total_emp_feb (FTE employment)
  expected_lane: difference_in_differences
  expected_disabled_lanes:
  - lane: rdd
    reason: no running variable or cutoff
  - lane: iv
    reason: no instrument present
  - lane: rct
    reason: state assignment is not randomized; natural experiment
  min_assertions:
  - selects the DID lane (not naive cross-sectional comparison)
  - identifies state as the group variable with 1=NJ treated, 0=PA control
  - recognizes total_emp_feb as pre-period and total_emp_nov as post-period outcome (handles wide format,
    e.g., reshapes to long)
  - DID point estimate is positive, in range [1.5, 4.0] FTE (ground truth +2.75)
  - conclusion states no employment decline in NJ relative to PA (does not report a negative effect)
  - uses all 384 stores (no rows dropped; data has zero nulls)
  notes: 'Canonical Card & Krueger (1994) balanced subsample, 2204 downloads, CC0. Verified by download+pandas;
    manual DID reproduces published +2.75 exactly. Main hazard: wide format with no time column, so the
    eval also tests reshape capability. Two-period two-group, so no pre-trend test possible.'
- case_id: synthetic-did-panel
  tier: primary
  question_type: did
  source:
    kaggle_slug: synthetic
    data_file: did_panel.csv (generated)
    synthetic_eval_fixture: true
    verified: false
    n_rows: 480
    synthetic_recipe: seed=42; 60 units (30 treated, 30 control) x 8 periods (0..7), T0=4. y_it = alpha_i
      + 0.3*t + 2.0*1[treated_i]*1[t>=4] + eps_it; alpha_i ~ N(10,2) for control, N(11.5,2) for treated
      (level gap, parallel trends); eps_it ~ N(0,1). Columns unit_id, group, period, post, outcome. Ground
      truth ATT = 2.0; OLS y ~ treated*post recovers it; baseline gap 1.5 is a distractor.
  causal_question: A policy took effect for the treated group starting in period 4. Estimate its effect
    on the outcome using the control group as the counterfactual.
  expected_fields:
    group: group
    time: 'period (post indicator: post)'
    treatment: group == treated
    outcome: outcome
  expected_lane: difference_in_differences
  expected_disabled_lanes:
  - lane: rdd
    reason: no running variable or cutoff
  - lane: iv
    reason: no instrument present
  min_assertions:
  - selects DID lane and uses two-way structure (group x post interaction or unit/period fixed effects)
  - point estimate within [1.6, 2.4] (ground truth delta = 2.0)
  - pre-trend check passes (pre-period group trends parallel by construction)
  - does not report the baseline level gap (+1.5) as the treatment effect
  notes: 'Complements the wide-format Card-Krueger entry: canonical long format with explicit group/time
    columns, multi-period pre-trends testable, exact known delta. Use when the eval needs a deterministic
    pass/fail band.'
- case_id: njmin-full-did
  tier: secondary
  question_type: did
  source:
    kaggle_slug: nathanlazarus/njminwage
    data_file: public.dat
    synthetic_eval_fixture: false
    verified: true
    n_rows: 410
  causal_question: Using the full Card-Krueger survey of 410 fast-food restaurants, estimate the effect
    of New Jersey's 1992 minimum wage increase on full-time-equivalent employment (FTE = EMPFT + 0.5*EMPPT
    + NMGRS) relative to Pennsylvania.
  expected_fields:
    group: STATE (col 3)
    time: 'implicit: wave-1 vs wave-2 column pairs'
    treatment: STATE=1 (NJ)
    outcome: FTE constructed from EMPFT/EMPPT/NMGRS (waves 1 and 2)
  expected_lane: difference_in_differences
  expected_disabled_lanes:
  - lane: rdd
    reason: no running variable or cutoff
  - lane: iv
    reason: no instrument present
  min_assertions:
  - DID estimate on FTE approximately +2.75 (NJ delta +0.47, PA delta -2.28); range [1.5, 4.0]
  - handles '.' missing values (complete-case n=384 for the balanced comparison)
  notes: 'This IS the original Card-Krueger release; verified to parse (sep=whitespace, na=''.'', 410x46)
    and to reproduce DID=+2.75. NOT suitable as a raw eval fixture: no header row, column meanings require
    the external codebook, FTE must be constructed. Usable only if the eval ships a preprocessed CSV with
    codebook names; then it also enables covariate-adjusted DID (chain, co-owned). Low visibility (10
    downloads, unknown license).'
- case_id: bank-recovery-rdd
  tier: primary
  question_type: rdd
  source:
    kaggle_slug: kingabzpro/bank-debt-data
    data_file: bank_data.csv
    synthetic_eval_fixture: false
    verified: true
    n_rows: 1882
  causal_question: Did assigning debts to the more intensive Level 1 recovery strategy (used for debts
    with expected recovery above $1000) cause higher actual recovery amounts than the cheaper Level 0
    strategy? Use the $1000 threshold.
  expected_fields:
    running_variable: expected_recovery_amount
    cutoff: 1000 (Level 0 covers 194-1000 inclusive; Level 1 starts at 1001, so treated = expected_recovery_amount
      > 1000)
    treatment: recovery_strategy Level 1 vs Level 0 (equivalently above/below the $1000 threshold)
    outcome: actual_recovery_amount
    confounders:
    - age
    - sex
  expected_lane: regression_discontinuity
  expected_disabled_lanes:
  - lane: difference_in_differences
    reason: no time dimension; single cross-section of debts
  - lane: panel_event_study
    reason: no panel structure or event dates
  - lane: instrumental_variables
    reason: no instrument separate from the assignment threshold; design is sharp, not fuzzy
  - lane: naive_group_comparison
    reason: expected recovery amount mechanically drives both strategy assignment and actual recovery;
      raw above/below comparison is confounded
  min_assertions:
  - RDD lane is selected and running variable is identified as expected_recovery_amount with cutoff at/near
    1000
  - analysis restricts to a local window around 1000 (e.g. 900-1100 or the 0-2000 Level0/Level1 band),
    not the full 194-9964 range spanning four thresholds
  - estimated jump in actual_recovery_amount at the cutoff is positive and statistically significant;
    magnitude roughly in the 150-400 dollar range (local linear in 900-1100 gives ~278, p<0.001)
  - 'covariate smoothness is checked: age and sex show no significant discontinuity at 1000 (age jump
    ~2.5, p~0.16 in the 900-1100 window)'
  - 'assignment is recognized as deterministic (sharp): recovery_strategy is a step function of expected_recovery_amount
    with breaks at 1000/2000/3000/5000'
  notes: 'Verified by download and local-linear fit. Sharp assignment confirmed: Level 0 = 194-1000, Level
    1 = 1001-1997, etc. Boundary convention matters: 1000 itself is untreated. Multiple higher thresholds
    (2000/3000/5000) exist and can serve as bonus placebo/extra-cutoff checks. 894 downloads, 12 votes,
    usability 1.0, no missing values. Also inspected jocelyndumlao/tripadvisor-rating-impact-on-hotel-popularity
    (real rounding-discontinuity design, 4599 rows) but rejected it: multi-cutoff (rating rounded to nearest
    0.5 across 8 thresholds), 272 columns, latin-1 encoding; requires bespoke running-variable centering
    an automated lane should not be graded on.'
- case_id: synthetic-scholarship-rdd
  tier: primary
  question_type: rdd
  source:
    kaggle_slug: synthetic
    data_file: scholarship_rdd.csv (generated)
    synthetic_eval_fixture: true
    verified: true
    n_rows: 2000
    synthetic_recipe: 'numpy default_rng(seed=42), n=2000. score = round(Uniform(0,100), 2); elig = 1{score>=50}.
      Sharp: d_sharp=elig; y_sharp = 20 + 0.3*score + 8.0*d_sharp + N(0,4). Fuzzy: takeup p = 0.90 if
      elig else 0.15; d_fuzzy ~ Bernoulli(p); y_fuzzy = 20 + 0.3*score + 8.0*d_fuzzy + N(0,4), independent
      noise draw. Round outcomes to 3dp. Ground truth: jump at cutoff = 8.0 for both variants (constant
      effect, so LATE = ATE = 8.0); fuzzy ITT jump = 8.0 * 0.75 = 6.0. Validated with statsmodels local
      linear (separate slopes) on |score-50|<=15: sharp 7.17 (se 0.65), fuzzy ITT 7.14, first stage 0.843,
      Wald LATE 8.46.'
  causal_question: 'Students scoring at least 50 on the entrance exam receive a scholarship. What is the
    causal effect of the scholarship on the academic outcome at the eligibility cutoff? (Fuzzy variant:
    eligibility only raises takeup from 15% to 90%; estimate the effect for compliers at the cutoff.)'
  expected_fields:
    running_variable: entrance_score
    cutoff: '50'
    treatment: scholarship_sharp (sharp) / scholarship_fuzzy (fuzzy)
    instrument: 'eligible (fuzzy variant only: threshold crossing instruments takeup)'
    outcome: gpa_outcome_sharp / gpa_outcome_fuzzy
  expected_lane: regression_discontinuity
  expected_disabled_lanes:
  - lane: difference_in_differences
    reason: no time dimension
  - lane: naive_group_comparison
    reason: outcome trends in entrance_score (slope 0.3), so above/below means without local control are
      biased upward
  min_assertions:
  - RDD lane selected; running variable entrance_score and cutoff 50 identified
  - 'sharp variant: local linear (or local poly) jump estimate within [6.0, 10.0] (true 8.0; seed-42 +/-15
    window gives 7.17, se 0.65)'
  - 'fuzzy variant: imperfect compliance detected (treated units below cutoff and untreated above); first-stage
    discontinuity in [0.6, 0.95] (true 0.75)'
  - 'fuzzy variant: LATE via ITT/first-stage (or 2SLS with eligible as instrument) within [6.0, 10.5]
    (true 8.0; seed-42 gives 8.46)'
