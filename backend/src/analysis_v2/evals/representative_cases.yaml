  expected_lane: interrupted_time_series
  expected_disabled_lanes:
  - lane: did
    reason: single univariate series, no control group exists in the fixture
  - lane: iv
    reason: no instrument
  - lane: propensity_matching
    reason: no unit-level treatment indicator; only a time cutoff
  min_assertions:
  - lane is interrupted time series with day-of-week seasonality handled
  - intervention date 2019-04-01 used as the break
  - estimated multiplicative level shift in [1.15, 1.35] (ground truth 1.25)
  - effect direction positive and statistically significant
  - a naive pre/post mean ratio (~1.19, biased low by -4.9% organic drift) is either corrected by trend
    modeling or the bias is acknowledged
  notes: 'Honesty: the REAL series has no documented intervention; the COVID-2020 window showed no clean
    shift (Page.Loads +0.7% yoy), so a real-data ITS eval here would be asserting noise. The injected-step
    fixture is the right design: exact ground truth, real seasonality/noise texture. Parsing gotcha: numeric
    columns use comma thousands separators and load as object without thousands='',''.'
