name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check causal_agent
      - run: uv run ruff format --check causal_agent
      - run: uv run lint-imports
      - run: uv run mypy
      - name: Build the required Docker script runtime
        run: make explore-image
      - run: uv run pytest causal_agent -q
        env:
          LANGSMITH_TRACING: "false"
      - name: the OpenAPI schema the web's types are generated from is committed as the server declares it
        run: uv run python -m causal_agent.server --openapi > web/openapi.json && git diff --exit-code web/openapi.json
      - name: the ladder tables under docs/ladders say what the lanes' declarations say
        run: uv run python -m causal_agent.evals.ladder && git diff --exit-code docs/ladders
        env:
          LANGSMITH_TRACING: "false"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: the generated types match the committed schema
        run: npm run types && git diff --exit-code src/generated/schema.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build


  ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: npm --prefix web ci
      - run: npm --prefix web exec -- playwright install --with-deps chromium
      - name: Consolidated Phase 4 verification with all shared Phase 1-4 fault controls
        run: make verify-phase4 ALL_CONTROLS=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingestion-evidence
          include-hidden-files: true
          path: |
            .artifacts/ingestion-tests/
            .artifacts/phase4/
            test-results/
            web/test-results/
