claim:story.text:
  value: Each row is one student's exam results. The change was a six-week test preparation
    course, offered to students at the school in the six weeks before the May 2026
    exam. Places were offered first by lunch status and parental education, then open
    to anyone who asked; the course column says who completed it. Lunch and parental
    level of education were recorded at enrolment; the math score is from the exam
    sat after the course.
  status: confirmed
