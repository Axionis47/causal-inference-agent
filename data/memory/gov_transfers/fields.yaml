claim:sampling.detail:
  value: The file keeps only households whose eligibility score sits within a narrow
    band around the programme's cutoff, so it is the households closest to the line
    on either side. The survey sample was drawn by side of the cutoff, two eligible
    households for every ineligible one.
  status: drafted
  source: doc:context
