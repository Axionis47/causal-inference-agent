# The fast checks, before every commit. The rest (types, tests) run in CI.
# Install once: uv run pre-commit install

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: lint-imports
        name: layer contract
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        types: [python]
