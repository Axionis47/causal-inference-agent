[project]
name = "causal-agent"
version = "0.1.0"
description = "Causal analysis agent: context pack, router, library specialists"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26,<3",
    "pydantic>=2.8",
    "pyyaml>=6",
    "langgraph>=1.0",
    "langgraph-cli[inmem]>=0.4",
    "langchain-core>=1.0",
    "langchain-google-vertexai>=2.0",
    "python-dotenv>=1.0",
    "langsmith>=0.4",
    "dowhy>=0.14",
    "pyfixest>=0.60",
    "wildboottest>=0.3.2",
    "rdrobust>=2.0",
    "rddensity>=3.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "langgraph-checkpoint-sqlite>=2.0",
    "matplotlib>=3.9",
    "rdlocrand>=2.0",
    "a2a-sdk[http-server]>=1.2,<2",
    "laya>=0.3.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["causal_agent"]

[dependency-groups]
dev = [
    "pytest>=8",
    "import-linter>=2.0",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pre-commit>=3.7",
    "ruff>=0.6",
    "types-pyyaml>=6",
]

# ------------------------------------------------------------------ tests

[tool.pytest.ini_options]
testpaths = ["causal_agent"]
python_files = ["test_*.py"]

# ------------------------------------------------------------------ style: ruff lints and formats

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = [".artifacts", ".langgraph_api", "data", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # the formatter owns line length
    "B905",  # zip without strict: the pairs here are built to the same length
    "UP031", # percent formatting inside regex-building test fakes
    "UP047", # PEP 695 generics are cosmetic here
]

[tool.ruff.lint.isort]
known-first-party = ["causal_agent"]

# ------------------------------------------------------------------ types: strict where the shared code lives, widened stage by stage

[tool.mypy]
python_version = "3.12"
packages = ["causal_agent"]
ignore_missing_imports = true
warn_unused_configs = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = [
    "causal_agent.common.*",
    "causal_agent.lane.*",
    "causal_agent.explore.*",
    "causal_agent.viz.*",
    "causal_agent.memory.*",
    "causal_agent.profile.*",
    "causal_agent.server.*",
    "causal_agent.families.*",
]
check_untyped_defs = true

[[tool.mypy.overrides]]
# still untyped: the desk and the lanes; see docs/architecture.md
module = ["causal_agent.desk.*", "causal_agent.families.*.lane.*", "causal_agent.families.*.evals.*"]
ignore_errors = true

# ------------------------------------------------------------------ layers: a lower package never imports a higher one
#
# Bottom to top. Every listed ignore is a known cycle a later stage removes; an ignore that no longer matches fails the
# check, so the list only shrinks.

[tool.importlinter]
root_package = "causal_agent"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
layers = [
    "causal_agent.server",
    "causal_agent.desk",
    "causal_agent.families",
    "causal_agent.explore",
    "causal_agent.lane",
    "causal_agent.viz",
    "causal_agent.memory",
    "causal_agent.profile",
    "causal_agent.common",
]
ignore_imports = [
    "causal_agent.**.tests.** -> causal_agent.desk.**",
    "causal_agent.**.tests.** -> causal_agent.families.**",
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "the core names no family"
type = "forbidden"
source_modules = ["causal_agent.common", "causal_agent.profile", "causal_agent.memory", "causal_agent.viz", "causal_agent.lane", "causal_agent.explore"]
forbidden_modules = ["causal_agent.families"]
allow_indirect_imports = "True"
ignore_imports = ["causal_agent.**.tests.** -> causal_agent.families.**"]

# ------------------------------------------------------------------ the adjustment lane's three parts
#
# The reasoning ends in a frozen design and never runs an estimate; the execution reads only the frozen design; the artifacts
# read only the results. DoWhy is imported by the engine alone.

[[tool.importlinter.contracts]]
name = "the adjustment lane's reasoning never runs an estimate"
type = "forbidden"
source_modules = ["causal_agent.families.adjustment.lane.reason"]
forbidden_modules = [
    "causal_agent.families.adjustment.lane.execute",
    "causal_agent.families.adjustment.lane.artifacts",
    "causal_agent.families.adjustment.lane.engine.estimators",
    "causal_agent.families.adjustment.lane.engine.falsify",
    "causal_agent.families.adjustment.lane.engine.sensitivity",
]

[[tool.importlinter.contracts]]
name = "the adjustment lane's execution reads only the frozen design"
type = "forbidden"
source_modules = ["causal_agent.families.adjustment.lane.execute", "causal_agent.families.adjustment.lane.engine"]
forbidden_modules = ["causal_agent.families.adjustment.lane.reason"]

[[tool.importlinter.contracts]]
name = "the adjustment lane's artifacts read only the results"
type = "forbidden"
source_modules = ["causal_agent.families.adjustment.lane.artifacts"]
forbidden_modules = [
    "causal_agent.families.adjustment.lane.reason",
    "causal_agent.families.adjustment.lane.execute",
    "causal_agent.families.adjustment.lane.engine",
]

[[tool.importlinter.contracts]]
name = "only the adjustment lane's engine imports DoWhy"
type = "forbidden"
source_modules = [
    "causal_agent.families.adjustment.lane.reason",
    "causal_agent.families.adjustment.lane.execute",
    "causal_agent.families.adjustment.lane.artifacts",
    "causal_agent.families.adjustment.lane.nodes",
]
forbidden_modules = ["dowhy"]
allow_indirect_imports = "True"

[[tool.importlinter.contracts]]
name = "the diff_in_diff lane's reasoning never fits an effect"
type = "forbidden"
source_modules = ["causal_agent.families.diff_in_diff.lane.reason"]
forbidden_modules = ["causal_agent.families.diff_in_diff.lane.execute", "causal_agent.families.diff_in_diff.lane.artifacts", "causal_agent.families.diff_in_diff.lane.engine.estimators", "causal_agent.families.diff_in_diff.lane.engine.falsify", "causal_agent.families.diff_in_diff.lane.engine.sensitivity"]

[[tool.importlinter.contracts]]
name = "the diff_in_diff lane's execution cannot reopen reasoning"
type = "forbidden"
source_modules = ["causal_agent.families.diff_in_diff.lane.execute", "causal_agent.families.diff_in_diff.lane.engine"]
forbidden_modules = ["causal_agent.families.diff_in_diff.lane.reason"]

[[tool.importlinter.contracts]]
name = "the diff_in_diff lane's artifacts read results only"
type = "forbidden"
source_modules = ["causal_agent.families.diff_in_diff.lane.artifacts"]
forbidden_modules = ["causal_agent.families.diff_in_diff.lane.execute", "causal_agent.families.diff_in_diff.lane.reason", "causal_agent.families.diff_in_diff.lane.engine"]

[[tool.importlinter.contracts]]
name = "the discontinuity lane's reasoning never fits an effect"
type = "forbidden"
source_modules = ["causal_agent.families.discontinuity.lane.reason"]
forbidden_modules = ["causal_agent.families.discontinuity.lane.execute", "causal_agent.families.discontinuity.lane.artifacts", "causal_agent.families.discontinuity.lane.engine.estimators", "causal_agent.families.discontinuity.lane.engine.falsify", "causal_agent.families.discontinuity.lane.engine.sensitivity"]

[[tool.importlinter.contracts]]
name = "the discontinuity lane's execution cannot reopen reasoning"
type = "forbidden"
source_modules = ["causal_agent.families.discontinuity.lane.execute", "causal_agent.families.discontinuity.lane.engine"]
forbidden_modules = ["causal_agent.families.discontinuity.lane.reason"]

[[tool.importlinter.contracts]]
name = "the discontinuity lane's artifacts read results only"
type = "forbidden"
source_modules = ["causal_agent.families.discontinuity.lane.artifacts"]
forbidden_modules = ["causal_agent.families.discontinuity.lane.execute", "causal_agent.families.discontinuity.lane.reason", "causal_agent.families.discontinuity.lane.engine"]
