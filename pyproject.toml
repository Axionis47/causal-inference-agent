[project]
name = "causal-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2,<3",
  "sqlalchemy>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "python-multipart>=0.0.20",
  "pwdlib[argon2]>=0.2,<1",
  "email-validator>=2,<3",
  "google-genai>=1,<3",
  "langsmith>=0.4,<1",
  "procrastinate>=3,<4",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "pillow>=12,<13",
  "mypy==2.4.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

